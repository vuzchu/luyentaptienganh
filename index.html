<!doctype html>

<title>Ôn tập cuối kỳ – Nghe · Đọc</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#22201c; --muted:#6f6a60; --line:#ddd6c8;
  --accent:#1f5f5b; --accent-soft:#e2efec; --key:#1f5f5b; --ok:#1c7a43; --ok-soft:#e4f3ea; --bad-soft:#eeeae0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:auto;letter-spacing:.2px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab small{opacity:.75;margin-left:4px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
section.screen{display:none}
section.screen.on{display:block}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:19px;margin:34px 0 6px;padding-top:8px}
.lead{color:var(--muted);margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chips a{font-size:13px;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.instr{color:var(--muted);font-style:italic;margin:0 0 10px}
audio{width:100%;margin:6px 0 12px}
.passage{background:#faf6ec;border-left:3px solid var(--accent);padding:12px 16px;border-radius:6px;margin:10px 0 16px}
.passage p{margin:0 0 10px}
.passage h4{margin:0 0 8px;text-align:center}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.qt{margin-bottom:6px}
.qimg{display:block;max-width:min(100%,320px);border:1px solid var(--line);border-radius:6px;margin:6px 0 8px;background:#fff}
.who{display:flex;gap:12px;align-items:flex-start}
.who img{width:96px;border-radius:6px;flex:none}
.opts{display:grid;gap:4px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.pics{grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-top:6px;flex:none}
.opt img{max-width:100%;max-height:150px;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.opts.pics .opt{flex-wrap:wrap}
/* đáp án: gạch chân + in đậm */
.done .opt{cursor:default}
.done .opt:hover{background:transparent}
.done .opt.key .lt,.done .opt.key .ot{color:var(--key);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.done .opt.key img{outline:3px solid var(--key)}
.done .opt.wrong .ot{text-decoration:line-through;color:var(--muted)}
.done .opt.wrong{background:var(--bad-soft)}
.done .opt.right{background:var(--ok-soft)}
.verdict{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;font-weight:600;font-size:14px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:#f6e7c8;color:#7a5200}
.q.isno{border-left:4px solid #d9a441;padding-left:12px}
.q.isok{border-left:4px solid #7fc29b;padding-left:12px}
.wr{color:#7a5200}
.mark{font-weight:700;margin-left:6px}
.mark.ok{color:var(--ok)} .mark.no{color:var(--muted)}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
button.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:wait}
.score{font-weight:700}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:90px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.src{background:#faf6ec;border-radius:6px;padding:10px 14px;margin:6px 0 10px}
.wc{font-size:13px;color:var(--muted)}
.model{margin-top:12px;padding:10px 14px;border:1px dashed var(--key);border-radius:8px}
.model b{display:block;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.model span{color:var(--key);white-space:pre-wrap}
.model span.u{text-decoration:underline;text-underline-offset:3px}
.ai{margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:8px;white-space:pre-wrap}
.ai b.h{display:block;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ai.err{background:var(--bad-soft)}
.rw{padding:12px 0;border-top:1px dashed var(--line)}
.rw:first-of-type{border-top:0}
.hint{color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-weight:600;margin:12px 0 4px}
dialog p{color:var(--muted);font-size:14px;margin:6px 0}
ul.tight{margin:6px 0;padding-left:20px}
@media (max-width:600px){.opts.pics{grid-template-columns:1fr 1fr}.brand{width:100%}}
</style>
</head>

 {id:'d3',title:'III. Correct / Incorrect',start:11,row:1,instr:'Read the article and decide whether each sentence is “Correct” (A) or “Incorrect” (B).',
  passage:`<h4>Co-operative Young Film-makers of the Year</h4>
<p>Have you got something to say? An idea for a great movie? An interesting documentary? Or an amusing comedy? Don't keep it to yourself. Get together with some friends, share your thoughts and make a film or video.</p>
<p>Every year, Co-operative Young Film-makers offers you the chance to see your work on the big screen. For over 30 years the Co-operative has organised a festival for young film-makers, proving how committed we are to young people and their films. We'll be holding this year's festival on Friday 9 and Saturday 10 October at the National Film Theatre.</p>
<p>We're looking for young film-makers with imagination. Whether you're already planning a career in the movies or have never made a film in your life, it doesn't matter. We want to see films and videos from people of all abilities and levels of experience.</p>
<p><b>NOW FOR OUR RULES AND SUGGESTIONS</b></p>
<p>* You might be at school or college. Perhaps a member of a youth club or drama group. Maybe just a group of friends. The only thing we do say is that you have to be less than 21 years old in order to enter our competition.</p>
<p>* We want to show as many films as we can on the big screen - the briefer the films, the more we can show. You can say a lot in the six minutes or less that we suggest. Especially if you plan your film in advance and edit it well.</p>
<p>* You need to supply your own equipment - try borrowing from family and friends. Most types of film and video are acceptable. Just concentrate on getting the most out of your equipment. Experiment a bit!</p>
<p>* Think of an interesting storyline. It'll help to make your work a bit different. We're really keen to get films about the environment or international issues. Why not try writing your own music?</p>
<p>Every film and video we receive is looked at by our group of judges. They watch each one from start to finish, then tell you what they think. This can really help if you are thinking about trying again in twelve months' time.</p>
<p>If your film is chosen for screening at the festival - and last year 50 were - you will get free entry to the festival, and we will cover any costs, such as your travel. The festival ends with a presentation on stage after your work is screened.</p>
<p>Get in touch before you start filming and we'll post you a full information pack. This will include a form to enter the competition and other details you need to consider.</p>
<p>Don't forget the competition closing date is Monday 11 May.</p>`,

 {id:'d4',title:'IV. Reading comprehension',instr:'Read the text and choose the correct answer A, B, C or D for each question.',
  passage:`<p>The Sun today is a yellow dwarf star. It is fueled by thermonuclear reactions near its center that convert hydrogen to helium. The Sun has existed in its present state for about four billion six hundred million years and is thousands of times larger than the Earth.</p>
<p>By studying other stars, astronomers can predict what the rest of the Sun's life will be like. About five billion years from now, the core of the Sun will shrink and become hotter. The surface temperature will fall. The higher temperature of the center will increase the rate of thermonuclear reactions. The outer regions of the Sun will expand approximately 35 million miles, about the distance to Mercury, which is the closest planet to the Sun. The Sun will then be a red giant star. Temperatures on the Earth will become too high for life to exist.</p>
<p>Once the Sun has used up its thermonuclear energy as a red giant, it will begin to shrink. After it shrinks to the size of the Earth, it will become a white dwarf star. The Sun may throw off huge amounts of gases in violent eruptions called nova explosions as it changes from a red giant to a white dwarf.</p>
<p>After billions of years as a white dwarf, the Sun will have used up all its fuel and will have lost its heat. Such a star is called a black dwarf. After the Sun has become a black dwarf, the Earth will be dark and cold. If any atmosphere remains there, it will have frozen over the Earth's surface.</p>`,

 {id:'d5',title:'V. Cloze – The Art of Drawing',row:1,instr:'Read the passage and choose the correct answer A, B, C or D to fill in each blank.',
  passage:`<h4>THE ART OF DRAWING</h4>

/* ===================== TRẮC NGHIỆM ===================== */
function quiz(id,qs,cfg={}){
  const st=S.quiz[id]||(S.quiz[id]={a:[],done:false});
  const box=el('div','quiz');
  const start=cfg.start||1;
  qs.forEach((q,i)=>{
    const d=el('div','q');
    let head=`<b>${start+i}.</b> ${q.q?esc(q.q):''}`;
    if(q.who) head=`<div class="who"><img src="${q.who}" alt=""><div>${head}</div></div>`;
    d.appendChild(el('div','qt',head));
    if(q.img){const im=el('img','qimg');im.src=q.img;im.alt='Notice '+(start+i);d.appendChild(im)}
    const opts=el('div','opts'+(q.imgs?' pics':cfg.row?' row':''));
    (q.imgs||q.o).forEach((o,j)=>{
      const lab=el('label','opt');
      const body=q.imgs?`<img src="${o}" alt="Picture ${LET[j]}">`:(cfg.html?o:esc(o));
      lab.innerHTML=`<input type="radio" name="${id}_${i}" value="${j}"><span class="lt">${LET[j]}.</span><span class="ot">${body}</span>`;
      const inp=lab.firstChild;
      if(st.a[i]===j)inp.checked=true;
      inp.onchange=()=>{st.a[i]=j;save()};
      opts.appendChild(lab);
    });
    d.appendChild(opts);box.appendChild(d);
  });
  const foot=el('div','foot');
  const sub=el('button','btn','Nộp bài'),redo=el('button','btn ghost','Làm lại'),sc=el('span','score');
  foot.append(sub,redo,sc);box.appendChild(foot);
  function grade(){
    let right=0;const wrong=[];box.classList.add('done');
    box.querySelectorAll('.q').forEach((d,i)=>{
      const k=qs[i].k,a=st.a[i];
      d.querySelectorAll('.opt').forEach((lab,j)=>{
        lab.firstChild.disabled=true;
        if(j===k)lab.classList.add('key');
        if(a===j)lab.classList.add(j===k?'right':'wrong');
      });
      if(a===k)right++;else wrong.push(start+i);
      d.classList.add(a===k?'isok':'isno');
      d.appendChild(el('div','verdict '+(a===k?'ok':'no'),a===k?`✓ Đúng — đáp án ${LET[k]}`:`✗ Sai — ${a==null?'bạn chưa chọn':'bạn chọn '+LET[a]}, đáp án đúng là ${LET[k]}`));
    });
    sc.innerHTML=`Kết quả: ${right}/${qs.length} câu đúng`+(wrong.length?` · <span class="wr">Sai câu: ${wrong.join(', ')}</span>`:' · Đúng hết 🎉');
    sub.disabled=true;
  }
  sub.onclick=()=>{st.done=true;save();grade()};
  redo.onclick=()=>{S.quiz[id]={a:[],done:false};save();box.replaceWith(quiz(id,qs,cfg))};
  if(st.done)grade();
  return box;
}

/* ===================== MÀN: NGHE ===================== */
function buildNghe(){
  const r=document.getElementById('nghe');
  r.innerHTML=`<h1>Kỹ năng Nghe 3</h1><p class="lead">8 bản ghi âm. Bấm phát, làm bài rồi <b>Nộp bài</b> — đáp án đúng sẽ được gạch chân.</p>
  <div class="chips">${[1,2,3,4,5,6,7,8].map(n=>`<a href="#rec${n}">Recording ${n}</a>`).join('')}</div>`;
  NGHE.forEach(p=>{
    r.appendChild(el('h2','',`Part ${p.part}`));
    r.appendChild(el('p','instr',esc(p.instr)));
    p.recs.forEach(rec=>{
      const c=el('div','card');c.id='rec'+rec.n;
      c.innerHTML=`<b>Recording ${rec.n}</b><audio controls preload="none" src="${AUDIO(rec.n)}"></audio>`;
      c.appendChild(quiz('L'+rec.n,rec.qs,{row:p.row}));
      r.appendChild(c);
    });
  });
}

/* ===================== MÀN: ĐỌC ===================== */
function buildDoc(){
  const r=document.getElementById('doc');
  r.innerHTML=`<h1>Kỹ năng Đọc 3</h1><p class="lead">6 dạng bài. Nộp từng phần để xem đáp án (gạch chân) và số câu đúng.</p>
  <div class="chips">${DOC.map(d=>`<a href="#${d.id}">${d.title.split('.')[0]}</a>`).join('')}</div>`;
  DOC.forEach(d=>{
    const c=el('div','card');c.id=d.id;
    c.innerHTML=`<h2 style="margin-top:0;padding-top:0">${esc(d.title)}</h2><p class="instr">${esc(d.instr)}</p>`+(d.passage?`<div class="passage">${d.passage}</div>`:'');
    c.appendChild(quiz('R'+d.id,d.qs,{row:d.row,html:d.html,start:d.start}));
    r.appendChild(c);
  });
}

/* ===================== ĐIỀU HƯỚNG & CÀI ĐẶT ===================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('.tab[data-s]').forEach(t=>t.classList.toggle('on',t.dataset.s===id));
  document.querySelectorAll('audio').forEach(a=>{if(!a.closest('.screen.on'))a.pause()});
  S.tab=id;save();window.scrollTo(0,0);
}
document.querySelectorAll('.tab[data-s]').forEach(t=>t.onclick=()=>show(t.dataset.s));
// chỉ phát một file âm thanh tại một thời điểm
document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
buildNghe();buildDoc();
show(['nghe','doc'].includes(S.tab)?S.tab:'nghe');
</script>
