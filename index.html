<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ôn tập cuối kỳ tiếng Anh</title>
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#22201c; --muted:#6f6a60; --line:#ddd6c8;
  --accent:#1f5f5b; --accent-soft:#e2efec; --key:#1f5f5b; --ok:#1c7a43; --ok-soft:#e4f3ea; --bad-soft:#eeeae0;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.6 "Segoe UI",system-ui,sans-serif}
header{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--card);border-bottom:1px solid var(--line)}
.bar{max-width:980px;margin:0 auto;padding:10px 16px;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.brand{font-weight:700;margin-right:auto;letter-spacing:.2px}
.tab{border:1px solid var(--line);background:transparent;color:var(--ink);padding:8px 16px;border-radius:999px;font:inherit;cursor:pointer}
.tab.on{background:var(--accent);border-color:var(--accent);color:#fff}
.tab small{opacity:.75;margin-left:4px}
main{max-width:980px;margin:0 auto;padding:20px 16px 80px}
section.screen{display:none}
section.screen.on{display:block}
h1{font-size:26px;margin:8px 0 4px}
h2{font-size:19px;margin:34px 0 6px;padding-top:8px}
.lead{color:var(--muted);margin:0 0 14px}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:10px 0 4px}
.chips a{font-size:13px;text-decoration:none;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:999px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin:12px 0}
.instr{color:var(--muted);font-style:italic;margin:0 0 10px}
audio{width:100%;margin:6px 0 12px}
.passage{background:#faf6ec;border-left:3px solid var(--accent);padding:12px 16px;border-radius:6px;margin:10px 0 16px}
.passage p{margin:0 0 10px}
.passage h4{margin:0 0 8px;text-align:center}
.q{padding:12px 0;border-top:1px dashed var(--line)}
.q:first-of-type{border-top:0}
.qt{margin-bottom:6px}
.qimg{display:block;max-width:min(100%,320px);border:1px solid var(--line);border-radius:6px;margin:6px 0 8px;background:#fff}
.who{display:flex;gap:12px;align-items:flex-start}
.who img{width:96px;border-radius:6px;flex:none}
.opts{display:grid;gap:4px}
.opts.row{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.opts.pics{grid-template-columns:repeat(3,1fr);gap:10px}
.opt{display:flex;gap:8px;align-items:flex-start;padding:6px 8px;border-radius:8px;cursor:pointer}
.opt:hover{background:var(--accent-soft)}
.opt input{margin-top:6px;flex:none}
.opt img{max-width:100%;max-height:150px;display:block;border:1px solid var(--line);border-radius:6px;background:#fff}
.opts.pics .opt{flex-wrap:wrap}
/* đáp án: gạch chân + in đậm */
.done .opt{cursor:default}
.done .opt:hover{background:transparent}
.done .opt.key .lt,.done .opt.key .ot{color:var(--key);text-decoration:underline;text-underline-offset:3px;font-weight:600}
.done .opt.key img{outline:3px solid var(--key)}
.done .opt.wrong .ot{text-decoration:line-through;color:var(--muted)}
.done .opt.wrong{background:var(--bad-soft)}
.done .opt.right{background:var(--ok-soft)}
.verdict{display:inline-block;margin-top:8px;padding:3px 12px;border-radius:999px;font-weight:600;font-size:14px}
.verdict.ok{background:var(--ok-soft);color:var(--ok)}
.verdict.no{background:#f6e7c8;color:#7a5200}
.q.isno{border-left:4px solid #d9a441;padding-left:12px}
.q.isok{border-left:4px solid #7fc29b;padding-left:12px}
.wr{color:#7a5200}
.mark{font-weight:700;margin-left:6px}
.mark.ok{color:var(--ok)} .mark.no{color:var(--muted)}
.foot{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:12px;padding-top:12px;border-top:1px solid var(--line)}
button.btn{font:inherit;border:1px solid var(--accent);background:var(--accent);color:#fff;padding:8px 16px;border-radius:8px;cursor:pointer}
button.btn.ghost{background:transparent;color:var(--accent)}
button.btn:disabled{opacity:.5;cursor:wait}
.score{font-weight:700}
textarea,input[type=text],input[type=password],select{width:100%;font:inherit;color:inherit;background:#fff;border:1px solid var(--line);border-radius:8px;padding:9px 11px}
textarea{resize:vertical;min-height:90px}
textarea:focus,input:focus{outline:2px solid var(--accent);outline-offset:1px}
.src{background:#faf6ec;border-radius:6px;padding:10px 14px;margin:6px 0 10px}
.wc{font-size:13px;color:var(--muted)}
.model{margin-top:12px;padding:10px 14px;border:1px dashed var(--key);border-radius:8px}
.model b{display:block;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.model span{color:var(--key);white-space:pre-wrap}
.model span.u{text-decoration:underline;text-underline-offset:3px}
.ai{margin-top:12px;padding:12px 14px;background:var(--accent-soft);border-radius:8px;white-space:pre-wrap}
.ai b.h{display:block;font-size:13px;letter-spacing:.3px;text-transform:uppercase;color:var(--accent);margin-bottom:4px}
.ai.err{background:var(--bad-soft)}
.rw{padding:12px 0;border-top:1px dashed var(--line)}
.rw:first-of-type{border-top:0}
.hint{color:var(--accent);font-weight:600}
dialog{border:1px solid var(--line);border-radius:12px;padding:20px;max-width:520px;width:calc(100% - 32px);background:var(--card);color:var(--ink)}
dialog::backdrop{background:rgba(0,0,0,.35)}
dialog label{display:block;font-weight:600;margin:12px 0 4px}
dialog p{color:var(--muted);font-size:14px;margin:6px 0}
ul.tight{margin:6px 0;padding-left:20px}
@media (max-width:600px){.opts.pics{grid-template-columns:1fr 1fr}.brand{width:100%}}
</style>
</head>
<body>
<header><div class="bar">
  <div class="brand">Ôn tập cuối kỳ</div>
  <button class="tab" data-s="nghe">🎧 Nghe</button>
  <button class="tab" data-s="doc">📖 Đọc</button>
  <button class="tab" data-s="viet">📝 Viết</button>
  <button class="tab" data-s="dich">✍️ Dịch</button>
  <button class="tab" id="cfgBtn" title="Cài đặt AI chấm bài">⚙️</button>
</div></header>

<main>
  <section class="screen" id="nghe"></section>
  <section class="screen" id="doc"></section>
  <section class="screen" id="viet"></section>
  <section class="screen" id="dich"></section>
</main>

<dialog id="cfg"><form method="dialog">
  <b>Cài đặt AI chấm bài</b>
  <p>Phần Viết và Dịch dùng Claude để chấm bài. Key chỉ lưu trong trình duyệt này và được gửi thẳng tới api.anthropic.com mỗi lần bạn bấm “AI chấm bài”.</p>
  <label for="cfgKey">Anthropic API key</label>
  <input type="password" id="cfgKey" autocomplete="off" placeholder="sk-ant-…">
  <div class="foot">
    <button class="btn" value="ok">Lưu</button>
    <button class="btn ghost" value="del">Xoá key</button>
    <button class="btn ghost" value="">Đóng</button>
  </div>
</form></dialog>

<script>
/* ===================== LƯU TRẠNG THÁI ===================== */
const SKEY='ontap_nghedoc_v1';
let S={quiz:{},tr:{},wr:{}};
try{S=Object.assign(S,JSON.parse(localStorage.getItem(SKEY)||'{}'))}catch(e){}
const save=()=>{try{localStorage.setItem(SKEY,JSON.stringify(S))}catch(e){}};
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const el=(tag,cls,html)=>{const e=document.createElement(tag);if(cls)e.className=cls;if(html!=null)e.innerHTML=html;return e};
const LET='ABCD';

/* ===================== DỮ LIỆU: NGHE ===================== */
const AUDIO=n=>`audio/recording-${n}.mp3`;
const pic=n=>`assets/nghe/image${String(n).padStart(3,'0')}.png`;
const pics=(start,list)=>list.map(([q,k],i)=>({q,k,imgs:[0,1,2].map(j=>pic(start+3*i+j))}));
const TF=['True','False'];
const NGHE=[
 {part:'I',instr:'Listen to short recordings and choose the correct picture for each question (A, B or C). You will listen twice.',recs:[
  {n:1,qs:pics(2,[['What did the man buy?',1],['How will the woman help the man?',2],['What will the students buy for their teacher?',1],['Which exhibition is the busiest today?',0],['Where can visitors see the ducks?',2]])},
  {n:2,qs:pics(17,[['Where will Peter give Joanna the book?',1],['What did the girl buy at the market?',2],['What will the weather be like for the race?',0],['What does the girl like best about the city?',2],['What does the boy think was unusual about the film?',0]])}
 ]},
 {part:'II',instr:'Listen to the recording and choose the correct answer for each question. You will listen to the recording twice.',recs:[
  {n:3,qs:[
   {q:'What does Tim enjoy most about his job?',o:['sorting out all the details','getting to know the musicians','listening to lots of good music'],k:2},
   {q:'Young musicians who want to do the course',o:['need to fill in an online form.','have to perform to a very high level.','must be able to speak English very well.'],k:0},
   {q:'Tim says that the teachers on the course',o:['usually enjoy themselves.','are always complaining.','are extremely well-paid.'],k:0},
   {q:'Tim likes to hold the course in a place which',o:['is specially designed for musicians.','is convenient for public transport.','is a long way from a big city.'],k:1},
   {q:'What does Tim say about musical instruments?',o:['Students cannot bring expensive ones.','Students sometimes lose them.','Students keep them in a special place.'],k:2}]},
  {n:4,qs:[
   {q:'Amy decided to become a fashion designer while',o:['she was still at school.','she was working in a shop.','she was helping run a fashion show.'],k:1},
   {q:'Amy says the most important skill for a designer is',o:['remaining patient in difficult situations.','knowing about different materials.','understanding how clothes are made.'],k:2},
   {q:'What does Amy particularly like about her work?',o:['being able to sell her designs.','seeing her clothes on display','having her name recognised'],k:2},
   {q:'How does Amy feel about today’s fashion?',o:['She would like clothes to be more practical.','She feels clothes should be more attractive.','She’s pleased sports clothes are popular.'],k:1},
   {q:'What helps Amy find new ideas for designs?',o:['seeing things around her.','going to visit museums.','looking at photos of clothes.'],k:0}]}
 ]},
 {part:'III',instr:'Listen and choose the best answer A, B, C or D for each question. You will listen to the recording twice.',row:1,recs:[
  {n:5,qs:[
   {q:'The time the trip takes is ________.',o:['one hour','one hour and a half','forty-five minutes','two hours'],k:1},
   {q:'In the past, Oldsville had an important ________ industry.',o:['tourism','farming','oil','railway'],k:2},
   {q:'Passengers can see pretty ________ close to the train.',o:['wild animals','flowers','desert plants','trees'],k:2},
   {q:'There are some attractive ________ to see under an old bridge.',o:['rivers','rocks','caves','birds'],k:1},
   {q:'In a small store on the train, ________ are on sale.',o:['snacks','books','souvenirs','drinks'],k:2},

   {q:'The train was built in ________.',o:['1923','1933','1943','1953'],k:1},
   {q:'During the trip, the speaker will sell drinks and snacks from a ________.',o:['trolley','backpack','basket','counter'],k:2}]},
  {n:6,qs:[
   {q:'Steve had accommodation in a shared ________.',o:['cabin','hotel','tent','hostel'],k:2},
   {q:'Steve says it was important to have good ________ at the end of each day.',o:['clothes','meals','equipment','weather'],k:1},
   {q:'Steve worked with a team that made a ________ through the forest.',o:['bridge','road','path','tunnel'],k:2},
   {q:'Steve also collected information needed for a ________ of the forest area.',o:['photograph','report','map','video'],k:2},
   {q:'In the morning Steve was surprised to hear the sound of ________ in the forest.',o:['monkeys','birds','rabbits','deer'],k:2},
   {q:'When he did the trip, Steve only had to pay for his ________.',o:['accommodation','meals','equipment','flight'],k:3},
   {q:'Steve travelled to New Zealand in ________.',o:['October','December','January','March'],k:2},
   {q:'The tourist centre is expected to open in another ________.',o:['six months','one or two years','three years','five years'],k:1}]}
 ]},
 {part:'IV',instr:'Listen to the conversation and decide whether each sentence is True or False. You will listen to the recording twice.',row:1,recs:[
  {n:7,qs:[
   ['They agree that the wildlife centre building is well designed.',1],
   ['Julie thought the sharks at the wildlife centre were frightening.',1],
   ['Julie found the building was too warm.',0],
   ['Greg was disappointed with the number of insects.',0],
   ['Greg only managed to see one tree frog.',1],
   ['Julie is very keen to return to the wildlife centre.',0],
   ['Greg believes they should learn more about the animals before visiting the wildlife centre again.',0],
   ['Julie agrees that learning more about the animals would make the visit more enjoyable.',1]].map(([q,k])=>({q,o:TF,k}))},
  {n:8,qs:[
   ['Martha thinks the last episode was easy to understand.',1],
   ['James believes Dr Madison is the main reason why the series is so successful.',0],
   ['They agree that the last show in the series was complicated.',0],
   ['James believes that the series is successful because of the main character.',0],
   ['They both admire the main character’s behaviour.',1],

   ['James was surprised to find the main character so funny.',1],
   ['They both plan to watch the series again.',1]].map(([q,k])=>({q,o:TF,k}))}
 ]}
];

/* ===================== DỮ LIỆU: ĐỌC ===================== */
const dimg=n=>`assets/doc/image${String(n).padStart(3,'0')}.jpg`;
const PR={
 spot:'<b>Spotlight.</b> This Thursday, writer Kate Dyer talks about the relationship between her poetry and her work as a history teacher. Kate will perform her latest poem, ‘Sunshine’. Listeners can then phone in and talk to Kate about her work. Dramatist David Fry will also talk about his latest book on historical drama from the 19th century.',
 gm:'<b>Good Morning.</b> This programme has regular reports on current affairs and news stories as they happen at home and abroad, plus discussions every morning about the background to world news. All this week, the programme features interviews with ordinary people around the world who talk about the recent history of their country.',

 hist:'<b>History team.</b> This Wednesday, a local team tries to prove that people lived in the rocky hills of their area thousands of years ago. Specialist presenter Dr. Clive Sparky describes what they find. Listeners can ring in and ask his questions, and discuss their own interests and local discoveries.',
 bot:'<b>Before Our Time.</b> On Saturday, this weekly programme includes the first part of a documentary series about the discovery of the site of a 15th-century village. Professor John Frost and his team will talk about what life was like for the villagers.'
};
const DOC=[
 {id:'d1',title:'I. Notices & messages',instr:'Read the texts or descriptions. Choose the correct answer A, B or C for the correct explanation.',qs:[
  {img:dimg(2),o:['This bus service cannot be used by college staff unless they show ID cards.','Students can get their ID cards on the bus.','Students are not allowed on the bus unless they have ID cards.'],k:2},
  {img:dimg(3),o:['Laura liked the jumper Jane bought, but needs it in a different size.','Laura wants to try to get the same jumper in a different colour.','Laura received two jumpers which were the same, so wants to exchange one.'],k:1},
  {img:dimg(4),q:'The library will',o:['have shorter opening hours until next Friday.','change its opening hours next Friday.','open again to students next Friday.'],k:1},
  {img:dimg(5),o:['Jo is pleased with the number of things she saw from the bus.','Jo regrets not having walked around the city to look at the sights.','Jo thinks there are better sightseeing tours than the one she took.'],k:0},
  {img:dimg(6),o:['Customers may park outside the market for up to three hours.','You may unload your vehicle here at any time.','Customers may park here at times when vehicles are not unloading.'],k:2},
  {img:dimg(7),o:['If you are ill, the library will not charge you for returning books late.','Send any books due back by post, as the library is closed.','As the library is closed, users can put books through the letterbox.'],k:2},
  {img:dimg(8),q:'To make biscuits, James needs to buy ______',o:['sugar.','butter.','flour.'],k:2},
  {img:dimg(9),o:['Do not leave your bicycle touching the window.','Your bicycle may not be safe here.','Broken glass may damage your bicycle tyres.'],k:0},
  {img:dimg(10),q:'If you want to go to London,',o:['buy a ticket before Saturday.','write your phone number here.','go and tell Kim immediately.'],k:1},
  {img:dimg(11),o:['The red light will come on when you enter this room.','Stay outside until the red light comes on.','Only come in if there is no red light showing.'],k:2}]},
 {id:'d2',title:'II. Matching people with radio programmes',start:6,html:1,instr:'The people below all want to find a radio programme they could enjoy listening to this week. Decide which programme would be the most suitable for each person.',qs:[
  {who:dimg(12),q:'Roberta and Alice are interested in pop music. They want to listen to a live performance, and would also enjoy hearing interviews with some of the performers.',o:[PR.spot,PR.gm,PR.out],k:2},
  {who:dimg(13),q:'Paul enjoys listening to good modern drama. He works long hours during the week so he can only listen to the radio at weekends.',o:[PR.show,PR.hist,PR.spot],k:0},
  {who:dimg(14),q:'Steven teaches history and likes listening to experts talking about his subject. However, he hates shows which invite listeners to phone in.',o:[PR.out,PR.bot,PR.show],k:1},
  {who:dimg(15),q:'Al writes poetry, and enjoys hearing other writers read their poems on the radio. He wants to have the opportunity to give his own opinions live on the programme.',o:[PR.spot,PR.bot,PR.out],k:0},
  {who:dimg(16),q:'Kim and Yannis are interested in finding out about the latest international events. They want to listen to a programme that is on every day.',o:[PR.hist,PR.gm,PR.show],k:1}]},
 {id:'d3',title:'III. Correct / Incorrect',start:11,row:1,instr:'Read the article and decide whether each sentence is “Correct” (A) or “Incorrect” (B).',
  passage:`<h4>Co-operative Young Film-makers of the Year</h4>
<p>Have you got something to say? An idea for a great movie? An interesting documentary? Or an amusing comedy? Don't keep it to yourself. Get together with some friends, share your thoughts and make a film or video.</p>
<p>Every year, Co-operative Young Film-makers offers you the chance to see your work on the big screen. For over 30 years the Co-operative has organised a festival for young film-makers, proving how committed we are to young people and their films. We'll be holding this year's festival on Friday 9 and Saturday 10 October at the National Film Theatre.</p>
<p>We're looking for young film-makers with imagination. Whether you're already planning a career in the movies or have never made a film in your life, it doesn't matter. We want to see films and videos from people of all abilities and levels of experience.</p>
<p><b>NOW FOR OUR RULES AND SUGGESTIONS</b></p>
<p>* You might be at school or college. Perhaps a member of a youth club or drama group. Maybe just a group of friends. The only thing we do say is that you have to be less than 21 years old in order to enter our competition.</p>
<p>* We want to show as many films as we can on the big screen - the briefer the films, the more we can show. You can say a lot in the six minutes or less that we suggest. Especially if you plan your film in advance and edit it well.</p>
<p>* You need to supply your own equipment - try borrowing from family and friends. Most types of film and video are acceptable. Just concentrate on getting the most out of your equipment. Experiment a bit!</p>
<p>* Think of an interesting storyline. It'll help to make your work a bit different. We're really keen to get films about the environment or international issues. Why not try writing your own music?</p>
<p>Every film and video we receive is looked at by our group of judges. They watch each one from start to finish, then tell you what they think. This can really help if you are thinking about trying again in twelve months' time.</p>
<p>If your film is chosen for screening at the festival - and last year 50 were - you will get free entry to the festival, and we will cover any costs, such as your travel. The festival ends with a presentation on stage after your work is screened.</p>
<p>Get in touch before you start filming and we'll post you a full information pack. This will include a form to enter the competition and other details you need to consider.</p>
<p>Don't forget the competition closing date is Monday 11 May.</p>`,
  qs:[
  ['This is the first Co-operative film-making competition for 30 years.',1],
  ['You can enter the competition without any experience of film-making.',0],
  ['The Co-operative prefers short films.',0],
  ['The Co-operative will lend you whatever you require to make your film.',1],
  ['The Co-operative suggests putting music in your film.',0],
  ['The judges will watch the whole of every film entered.',0],
  ['If you are 18 and enter the competition this year, you can still enter it next year.',0],
  ['Films entered in the competition are all screened at the festival.',1],
  ['The Co-operative pays for some people to attend the festival.',1],
  ['Information packs will be available from 11 May.',1]].map(([q,k])=>({q,o:['Correct','Incorrect'],k}))},
 {id:'d4',title:'IV. Reading comprehension',instr:'Read the text and choose the correct answer A, B, C or D for each question.',
  passage:`<p>The Sun today is a yellow dwarf star. It is fueled by thermonuclear reactions near its center that convert hydrogen to helium. The Sun has existed in its present state for about four billion six hundred million years and is thousands of times larger than the Earth.</p>
<p>By studying other stars, astronomers can predict what the rest of the Sun's life will be like. About five billion years from now, the core of the Sun will shrink and become hotter. The surface temperature will fall. The higher temperature of the center will increase the rate of thermonuclear reactions. The outer regions of the Sun will expand approximately 35 million miles, about the distance to Mercury, which is the closest planet to the Sun. The Sun will then be a red giant star. Temperatures on the Earth will become too high for life to exist.</p>
<p>Once the Sun has used up its thermonuclear energy as a red giant, it will begin to shrink. After it shrinks to the size of the Earth, it will become a white dwarf star. The Sun may throw off huge amounts of gases in violent eruptions called nova explosions as it changes from a red giant to a white dwarf.</p>
<p>After billions of years as a white dwarf, the Sun will have used up all its fuel and will have lost its heat. Such a star is called a black dwarf. After the Sun has become a black dwarf, the Earth will be dark and cold. If any atmosphere remains there, it will have frozen over the Earth's surface.</p>`,
  qs:[
  {q:'It can be inferred from the passage that the Sun ________.',o:['is approximately halfway through its life as a yellow dwarf star','will continue to be a yellow dwarf for another 10 billion years','has been in existence for 10 billion years','is rapidly changing in size and brightness'],k:0},
  {q:'What will probably be the first stage of change for the Sun to become a red giant?',o:['Its surface will become hotter and shrink.','It will throw off huge amounts of gases.','Its central part will grow smaller and hotter.','Its core will cool off and use less fuel.'],k:2},
  {q:'When the Sun becomes a red giant, what will the atmosphere be like on the Earth?',o:['It will be enveloped in the expanding surface of the sun.','It will become too hot for life to exist.','It will be almost destroyed by nova explosions.','It will freeze and become solid.'],k:1},
  {q:'When the Sun has used up its energy as a red giant, it will ______.',o:['get frozen','cease to exist','stop to expand','become smaller'],k:3},
  {q:'Large amounts of gases may be released from the Sun at the end of its life as a ________.',o:['black dwarf','white dwarf','red giant','yellow dwarf'],k:2},

/* ===================== TRẮC NGHIỆM ===================== */
function quiz(id,qs,cfg={}){
  const st=S.quiz[id]||(S.quiz[id]={a:[],done:false});
  const box=el('div','quiz');
  const start=cfg.start||1;
  // st.p: thứ tự hiển thị đáp án của từng câu khi đã đảo; st.a vẫn lưu chỉ số gốc
  const nOpt=i=>(qs[i].imgs||qs[i].o).length;
  const order=i=>(st.p&&st.p[i])||Array.from({length:nOpt(i)},(_,x)=>x);
  const mixed=i=>{
    const cur=order(i);
    if(cur.length<3)return cur; // True/False, Correct/Incorrect giữ nguyên
    let p;
    do{p=cur.slice();for(let x=p.length-1;x>0;x--){const y=Math.floor(Math.random()*(x+1));[p[x],p[y]]=[p[y],p[x]]}}while(p.join()===cur.join());
    return p;
  };
  qs.forEach((q,i)=>{
    const d=el('div','q');
    let head=`<b>${start+i}.</b> ${q.q?esc(q.q):''}`;
    if(q.who) head=`<div class="who"><img src="${q.who}" alt=""><div>${head}</div></div>`;
    d.appendChild(el('div','qt',head));
    if(q.img){const im=el('img','qimg');im.src=q.img;im.alt='Notice '+(start+i);d.appendChild(im)}
    const opts=el('div','opts'+(q.imgs?' pics':cfg.row?' row':''));
    const list=q.imgs||q.o;
    order(i).forEach((j,pos)=>{
      const o=list[j],lab=el('label','opt');lab.dataset.j=j;
      const body=q.imgs?`<img src="${o}" alt="Picture ${LET[pos]}">`:(cfg.html?o:esc(o));
      lab.innerHTML=`<input type="radio" name="${id}_${i}" value="${j}"><span class="lt">${LET[pos]}.</span><span class="ot">${body}</span>`;
      const inp=lab.firstChild;
      if(st.a[i]===j)inp.checked=true;
      inp.onchange=()=>{st.a[i]=j;save()};
      opts.appendChild(lab);
    });
    d.appendChild(opts);box.appendChild(d);
  });
  const foot=el('div','foot');
  const sub=el('button','btn','Nộp bài'),redo=el('button','btn ghost','Làm lại'),sc=el('span','score');
  foot.append(sub,redo);
  if(st.p&&qs.some((_,i)=>nOpt(i)>2)){
    const orig=el('button','btn ghost','Thứ tự gốc');
    orig.onclick=()=>{S.quiz[id]={a:[],done:false};save();box.replaceWith(quiz(id,qs,cfg))};
    foot.append(orig);
  }
  foot.append(sc);box.appendChild(foot);
  function grade(){
    let right=0;const wrong=[];box.classList.add('done');
    box.querySelectorAll('.q').forEach((d,i)=>{
      const k=qs[i].k,a=st.a[i],L=j=>LET[order(i).indexOf(j)];
      d.querySelectorAll('.opt').forEach(lab=>{
        const j=+lab.dataset.j;
        lab.firstChild.disabled=true;
        if(j===k)lab.classList.add('key');
        if(a===j)lab.classList.add(j===k?'right':'wrong');
      });
      if(a===k)right++;else wrong.push(start+i);
      d.classList.add(a===k?'isok':'isno');
      d.appendChild(el('div','verdict '+(a===k?'ok':'no'),a===k?`✓ Đúng — đáp án ${L(k)}`:`✗ Sai — ${a==null?'bạn chưa chọn':'bạn chọn '+L(a)}, đáp án đúng là ${L(k)}`));
    });
    sc.innerHTML=`Kết quả: ${right}/${qs.length} câu đúng`+(wrong.length?` · <span class="wr">Sai câu: ${wrong.join(', ')}</span>`:' · Đúng hết 🎉');
    sub.disabled=true;
  }
  sub.onclick=()=>{st.done=true;save();grade()};
  // làm lại thì đảo luôn vị trí đáp án
  redo.onclick=()=>{S.quiz[id]={a:[],done:false,p:qs.map((_,i)=>mixed(i))};save();box.replaceWith(quiz(id,qs,cfg))};
  if(st.done)grade();
  return box;
}

/* ===================== MÀN: NGHE ===================== */
function buildNghe(){
  const r=document.getElementById('nghe');
  r.innerHTML=`<h1>Kỹ năng Nghe 3</h1><p class="lead">8 bản ghi âm. Bấm phát, làm bài rồi <b>Nộp bài</b> — đáp án đúng sẽ được gạch chân.</p>
  <div class="chips">${[1,2,3,4,5,6,7,8].map(n=>`<a href="#rec${n}">Recording ${n}</a>`).join('')}</div>`;
  NGHE.forEach(p=>{
    r.appendChild(el('h2','',`Part ${p.part}`));
    r.appendChild(el('p','instr',esc(p.instr)));
    p.recs.forEach(rec=>{
      const c=el('div','card');c.id='rec'+rec.n;
      c.innerHTML=`<b>Recording ${rec.n}</b><audio controls preload="none" src="${AUDIO(rec.n)}"></audio>`;
      c.appendChild(quiz('L'+rec.n,rec.qs,{row:p.row}));
      r.appendChild(c);
    });
  });
}

/* ===================== MÀN: ĐỌC ===================== */
function buildDoc(){
  const r=document.getElementById('doc');
  r.innerHTML=`<h1>Kỹ năng Đọc 3</h1><p class="lead">6 dạng bài. Nộp từng phần để xem đáp án (gạch chân) và số câu đúng.</p>
  <div class="chips">${DOC.map(d=>`<a href="#${d.id}">${d.title.split('.')[0]}</a>`).join('')}</div>`;
  DOC.forEach(d=>{
    const c=el('div','card');c.id=d.id;
    c.innerHTML=`<h2 style="margin-top:0;padding-top:0">${esc(d.title)}</h2><p class="instr">${esc(d.instr)}</p>`+(d.passage?`<div class="passage">${d.passage}</div>`:'');
    c.appendChild(quiz('R'+d.id,d.qs,{row:d.row,html:d.html,start:d.start}));
    r.appendChild(c);
  });
}

const DICH=[
 {id:'ev',title:'Part 1. English → Vietnamese',to:'tiếng Việt',instr:'Translate the following passages into Vietnamese (5 points).',items:[
  [`Health experts argue that sleeping fewer than six hours a night may increase the risk of developing various chronic diseases, while many people still underestimate the importance of sleep for overall health. Individuals who regularly suffer from sleep deprivation not only find it difficult to concentrate but also tend to experience higher levels of stress and fatigue in their daily work.`,
   `Các chuyên gia y tế cho rằng ngủ ít hơn sáu tiếng mỗi đêm có thể làm tăng nguy cơ mắc nhiều bệnh mãn tính khác nhau, trong khi nhiều người vẫn đánh giá thấp tầm quan trọng của giấc ngủ đối với sức khỏe tổng thể. Những người thường xuyên bị thiếu ngủ không chỉ khó tập trung mà còn có xu hướng căng thẳng và mệt mỏi nhiều hơn trong công việc hằng ngày.`],
  [`People who know how to listen to others often build stronger and more lasting relationships because they are able to understand the emotions and needs of those around them. When disagreements occur, resolving problems through discussion usually leads to more positive outcomes than avoiding the issue or criticizing one another. Many psychologists believe that trust can only be established when both parties are willing to share their thoughts honestly.`,
   `Những người biết lắng nghe người khác thường xây dựng được các mối quan hệ bền chặt và lâu dài hơn vì họ có thể thấu hiểu cảm xúc và nhu cầu của những người xung quanh. Khi xảy ra bất đồng, giải quyết vấn đề thông qua trao đổi thường mang lại kết quả tích cực hơn so với né tránh vấn đề hay chỉ trích lẫn nhau. Nhiều nhà tâm lý học tin rằng lòng tin chỉ có thể được tạo dựng khi cả hai bên đều sẵn sàng chia sẻ suy nghĩ của mình một cách trung thực.`],
  [`If cities continue to expand without sustainable development plans, many serious environmental problems may arise in the future. The increasing number of vehicles not only contributes to air pollution but also places considerable pressure on urban infrastructure that is already overloaded in many areas.`,
   `Nếu các thành phố tiếp tục mở rộng mà không có kế hoạch phát triển bền vững, nhiều vấn đề môi trường nghiêm trọng có thể nảy sinh trong tương lai. Số lượng phương tiện giao thông ngày càng tăng không chỉ góp phần gây ô nhiễm không khí mà còn tạo áp lực đáng kể lên cơ sở hạ tầng đô thị vốn đã quá tải ở nhiều khu vực.`],
  [`After working continuously for many hours, many employees find it difficult to maintain concentration and high levels of productivity. Some companies have introduced flexible working schedules so that employees can achieve a better balance between their professional responsibilities and personal lives.`,
   `Sau khi làm việc liên tục trong nhiều giờ, nhiều nhân viên cảm thấy khó duy trì sự tập trung và năng suất cao. Một số công ty đã áp dụng lịch làm việc linh hoạt để nhân viên có thể cân bằng tốt hơn giữa trách nhiệm công việc và cuộc sống cá nhân.`],
  [`Considered one of the most popular forms of entertainment today, cinema not only provides moments of relaxation but also reflects many important social issues. Films based on real-life events often attract public attention because they help audiences gain a better understanding of actual events and people.`,
   `Được xem là một trong những hình thức giải trí phổ biến nhất hiện nay, điện ảnh không chỉ mang lại những phút giây thư giãn mà còn phản ánh nhiều vấn đề xã hội quan trọng. Những bộ phim dựa trên các sự kiện có thật thường thu hút sự chú ý của công chúng vì chúng giúp khán giả hiểu rõ hơn về những sự kiện và con người có thật.`],
  [`Although life expectancy has increased significantly thanks to advances in modern medicine, many experts are concerned that the number of people suffering from lifestyle-related diseases is rising at an alarming rate. Diseases that were once mainly associated with older adults are now being diagnosed in younger individuals, largely as a result of unhealthy diets and prolonged physical inactivity.`,
   `Mặc dù tuổi thọ đã tăng lên đáng kể nhờ những tiến bộ của y học hiện đại, nhiều chuyên gia lo ngại rằng số người mắc các bệnh liên quan đến lối sống đang gia tăng ở mức đáng báo động. Những căn bệnh trước đây chủ yếu gặp ở người cao tuổi nay đang được chẩn đoán ở những người trẻ hơn, phần lớn là do chế độ ăn uống không lành mạnh và tình trạng ít vận động kéo dài.`],
  [`Although many people know that daily exercise brings immense benefits to their health, they still struggle to maintain this habit due to their busy work schedules. If you cannot spend an hour at the gym, taking a brisk walk for about twenty minutes around your neighborhood in the evening is also an excellent alternative. When the body is exercised regularly, the immune system will become stronger, which helps you prevent many common illnesses.`,
   `Mặc dù nhiều người biết rằng tập thể dục hằng ngày mang lại lợi ích to lớn cho sức khỏe, họ vẫn chật vật duy trì thói quen này do lịch làm việc bận rộn. Nếu bạn không thể dành một tiếng ở phòng tập, thì đi bộ nhanh khoảng hai mươi phút quanh khu phố vào buổi tối cũng là một lựa chọn thay thế tuyệt vời. Khi cơ thể được vận động thường xuyên, hệ miễn dịch sẽ trở nên khỏe mạnh hơn, giúp bạn phòng ngừa nhiều bệnh thông thường.`],
  [`In any long-term relationship, trust is always considered the foundational element because without it, the affection between both sides can easily break down. When a misunderstanding occurs, sitting down together to listen to each other's opinions calmly is much more effective than choosing to remain silent.`,
   `Trong bất kỳ mối quan hệ lâu dài nào, lòng tin luôn được xem là yếu tố nền tảng vì nếu thiếu nó, tình cảm giữa hai bên có thể dễ dàng đổ vỡ. Khi xảy ra hiểu lầm, cùng nhau ngồi xuống bình tĩnh lắng nghe ý kiến của nhau sẽ hiệu quả hơn nhiều so với việc chọn im lặng.`],
  [`Since the amount of plastic waste released into the environment every day is increasing at an alarming rate, countries around the world are facing a severe pollution crisis. Although campaigns calling for limits on plastic bag use have been widely implemented, people's consumption habits have not seen many positive changes.`,
   `Do lượng rác thải nhựa thải ra môi trường mỗi ngày đang tăng ở mức đáng báo động, các quốc gia trên thế giới đang phải đối mặt với một cuộc khủng hoảng ô nhiễm nghiêm trọng. Mặc dù các chiến dịch kêu gọi hạn chế sử dụng túi ni lông đã được triển khai rộng rãi, thói quen tiêu dùng của người dân vẫn chưa có nhiều thay đổi tích cực.`],
  [`Since staying hydrated is essential for regulating body temperature and supporting digestion, you should make an effort to drink at least two liters of water every day. Many people often reach for carbonated drinks or coffee when they feel thirsty, which can inadvertently lead to mild dehydration and energy crashes later on. If you find it difficult to remember to drink water, keeping a reusable bottle on your desk can serve as an excellent visual reminder.`,
   `Vì việc cung cấp đủ nước cho cơ thể rất cần thiết để điều hòa thân nhiệt và hỗ trợ tiêu hóa, bạn nên cố gắng uống ít nhất hai lít nước mỗi ngày. Nhiều người thường tìm đến đồ uống có ga hoặc cà phê khi thấy khát, điều này có thể vô tình dẫn đến mất nước nhẹ và tình trạng tụt năng lượng sau đó. Nếu bạn thấy khó nhớ việc uống nước, để một chai nước dùng nhiều lần trên bàn làm việc có thể là một lời nhắc trực quan rất hiệu quả.`],
  [`Although social media platforms allow us to stay connected with hundreds of friends online, they cannot replace the emotional depth of face-to-face interactions. When we spend too much time scrolling through virtual updates, we might accidentally neglect the real relationships with family members who are sitting right next to us.`,
   `Mặc dù các nền tảng mạng xã hội cho phép chúng ta giữ liên lạc với hàng trăm người bạn trên mạng, chúng không thể thay thế được chiều sâu cảm xúc của những cuộc gặp gỡ trực tiếp. Khi dành quá nhiều thời gian lướt xem các cập nhật trên thế giới ảo, chúng ta có thể vô tình bỏ bê những mối quan hệ thực với người thân đang ngồi ngay bên cạnh mình.`],
  [`As global temperatures continue to rise due to greenhouse gas emissions, polar ice sheets are melting faster than scientists previously predicted. If coastal cities do not invest in robust flood defense systems immediately, millions of people will be forced to leave their homes because of rising sea levels.`,
   `Khi nhiệt độ toàn cầu tiếp tục tăng do phát thải khí nhà kính, các tảng băng ở hai cực đang tan nhanh hơn so với dự đoán trước đây của các nhà khoa học. Nếu các thành phố ven biển không lập tức đầu tư vào hệ thống phòng chống lũ lụt vững chắc, hàng triệu người sẽ buộc phải rời bỏ nhà cửa vì mực nước biển dâng.`],
  [`The Vietnam Golf Association (VGA) and Singapore Golf Association (SGA) have signed a Memorandum of Understanding (MoU) about their cooperation to develop the sport in two countries. Under the three-year deal, the two sides will coordinate to organize professional golf training courses for both associations' leaders and members of board of directors, sharing experiences on golf development strategy and management.`,
   `Hiệp hội Golf Việt Nam (VGA) và Hiệp hội Golf Singapore (SGA) đã ký Biên bản ghi nhớ (MoU) về việc hợp tác phát triển môn thể thao này ở hai nước. Theo thỏa thuận có thời hạn ba năm, hai bên sẽ phối hợp tổ chức các khóa đào tạo golf chuyên nghiệp cho lãnh đạo và thành viên hội đồng quản trị của cả hai hiệp hội, đồng thời chia sẻ kinh nghiệm về chiến lược phát triển và quản lý golf.`],
  [`The south-central coastal province of Khanh Hoa will organize a range of festivals and tourism, sports, cultural events in an effort to bolster the province’s tourism brand and attract tourists during the summer travel season. The Nha Trang Beach Tourism Festival that will take place from June 13 to 16 in Nha Trang City is one of major events that is expected to draw a large number of visitors during this summer, according to the provincial Department of Tourism.`,
   `Tỉnh Khánh Hòa thuộc vùng duyên hải Nam Trung Bộ sẽ tổ chức hàng loạt lễ hội cùng các sự kiện du lịch, thể thao, văn hóa nhằm nâng tầm thương hiệu du lịch của tỉnh và thu hút du khách trong mùa du lịch hè. Theo Sở Du lịch tỉnh, Liên hoan Du lịch Biển Nha Trang diễn ra từ ngày 13 đến 16 tháng 6 tại thành phố Nha Trang là một trong những sự kiện lớn được kỳ vọng sẽ thu hút đông đảo du khách trong mùa hè này.`],
  [`The French consulate in HCM City general launched an art exhibition called “Sport and Fraternity” at the French Residence on June 11 to mark the upcoming Olympic and Paralympic Games in Paris this summer. It features 13 photos by news agency AFP of athletes and audiences and others honoring the positive values of sports such as respect, determination and sportsmanship.`,
   `Tổng Lãnh sự quán Pháp tại TP. Hồ Chí Minh đã khai mạc triển lãm nghệ thuật mang tên “Thể thao và Tình huynh đệ” tại Dinh thự Pháp vào ngày 11 tháng 6 để chào mừng Thế vận hội Olympic và Paralympic sắp diễn ra tại Paris mùa hè này. Triển lãm trưng bày 13 bức ảnh của hãng thông tấn AFP chụp các vận động viên, khán giả và những người khác, tôn vinh các giá trị tích cực của thể thao như sự tôn trọng, lòng quyết tâm và tinh thần thể thao.`]
 ]},
 {id:'ve',title:'Part 2. Vietnamese → English',to:'tiếng Anh',instr:'Translate these following passages into English (5 points).',items:[
  [`Mặc dù hầu hết mọi người đều nhận thức được rằng việc duy trì một chế độ ăn uống cân bằng và tập thể dục thường xuyên có thể giúp phòng ngừa nhiều bệnh nguy hiểm, nhiều người vẫn lựa chọn những thói quen không lành mạnh vì áp lực công việc và cuộc sống hiện đại. Các chuyên gia y tế cho rằng tình trạng này không chỉ làm gia tăng nguy cơ mắc các bệnh mãn tính như tiểu đường và tim mạch mà còn ảnh hưởng tiêu cực đến sức khỏe tinh thần của con người.`,
   `Although most people are aware that maintaining a balanced diet and exercising regularly can help prevent many dangerous diseases, many still choose unhealthy habits because of the pressures of work and modern life. Health experts believe that this situation not only increases the risk of chronic diseases such as diabetes and cardiovascular disease but also has a negative effect on people's mental health.`],
  [`Mặc dù công nghệ hiện đại đã giúp mọi người dễ dàng liên lạc với nhau bất kể khoảng cách địa lý, nhiều người cho rằng các mối quan hệ cá nhân ngày nay thiếu sự gắn kết sâu sắc như trước đây. Khi mọi người dành quá nhiều thời gian cho các thiết bị điện tử thay vì trò chuyện trực tiếp, những hiểu lầm và khoảng cách về mặt cảm xúc có thể xuất hiện thường xuyên hơn.`,
   `Although modern technology has made it easy for people to keep in touch with one another regardless of geographical distance, many believe that personal relationships today lack the deep bonds they once had. When people spend too much time on electronic devices instead of talking face to face, misunderstandings and emotional distance may arise more often.`],
  [`Nhiều quốc gia đã triển khai các chính sách nhằm giảm lượng khí thải gây hiệu ứng nhà kính, tuy nhiên biến đổi khí hậu vẫn tiếp tục gây ra những tác động nghiêm trọng đối với môi trường và đời sống con người trên toàn thế giới. Các nhà khoa học cảnh báo rằng nếu không có những hành động quyết liệt hơn trong tương lai gần, các hiện tượng thời tiết cực đoan sẽ xảy ra thường xuyên hơn và gây ra những thiệt hại to lớn về kinh tế.`,
   `Many countries have implemented policies aimed at reducing greenhouse gas emissions; however, climate change continues to have serious impacts on the environment and on human life around the world. Scientists warn that unless more decisive action is taken in the near future, extreme weather events will occur more frequently and cause enormous economic losses.`],
  [`Được hình thành qua nhiều thế hệ và chịu ảnh hưởng bởi những điều kiện lịch sử khác nhau, các phong tục truyền thống thường phản ánh những giá trị cốt lõi của một cộng đồng. Tuy nhiên, khi quá trình toàn cầu hóa diễn ra mạnh mẽ hơn, nhiều tập quán đang dần thay đổi để thích nghi với lối sống hiện đại và nhu cầu của xã hội đương đại.`,
   `Formed over many generations and influenced by different historical conditions, traditional customs often reflect the core values of a community. However, as globalization gathers pace, many practices are gradually changing to adapt to modern lifestyles and the needs of contemporary society.`],
  [`Nhờ những tiến bộ trong công nghệ và sự mở rộng của thương mại quốc tế, nhiều quốc gia đang đạt được tốc độ tăng trưởng kinh tế nhanh hơn so với trước đây. Tuy nhiên, lợi ích của sự phát triển không phải lúc nào cũng được phân bổ đồng đều, dẫn đến khoảng cách thu nhập ngày càng lớn giữa các nhóm dân cư khác nhau.`,
   `Thanks to advances in technology and the expansion of international trade, many countries are achieving faster economic growth than before. However, the benefits of development are not always evenly distributed, leading to a widening income gap between different groups of the population.`],
  [`Mặc dù công nghệ y tế đã phát triển đáng kể trong những năm gần đây, việc tiếp cận các dịch vụ chăm sóc sức khỏe chất lượng cao vẫn là một thách thức đối với nhiều người sống ở vùng sâu vùng xa. Những bệnh nhân không được chẩn đoán và điều trị kịp thời thường có nguy cơ gặp phải các biến chứng nghiêm trọng, điều này không chỉ ảnh hưởng đến chất lượng cuộc sống mà còn làm gia tăng chi phí điều trị.`,
   `Although medical technology has developed considerably in recent years, access to high-quality healthcare services remains a challenge for many people living in remote areas. Patients who are not diagnosed and treated in time are often at risk of serious complications, which not only affects their quality of life but also increases the cost of treatment.`],
  [`Bởi vì áp lực từ công việc và cuộc sống hiện đại ngày càng lớn, tình trạng kiệt sức đã trở thành một vấn đề phổ biến đối với rất nhiều nhân viên văn phòng hiện nay. Nhiều người thường có thói quen làm việc xuyên đêm hoặc mang việc về nhà vào cuối tuần, điều này khiến cho họ không còn thời gian để tái tạo lại năng lượng.`,
   `Because the pressure of work and modern life is growing, burnout has become a common problem for a great many office workers today. Many people are in the habit of working through the night or taking work home at the weekend, which leaves them no time to recharge their energy.`],
  [`Mặc dù các rạp chiếu phim truyền thống đang phải cạnh tranh gay gắt với các ứng dụng xem phim trực tuyến, hình thức giải trí này vẫn giữ được một vị thế đặc biệt trong lòng khán giả. Việc thưởng thức một bộ phim bom tấn trên màn ảnh rộng với hệ thống âm thanh sống động mang lại những trải nghiệm chân thực mà không một thiết bị cá nhân nào có thể thay thế được.`,
   `Although traditional cinemas are facing fierce competition from online streaming apps, this form of entertainment still holds a special place in audiences' hearts. Enjoying a blockbuster on the big screen with a vivid sound system offers a lifelike experience that no personal device can replace.`],
  [`Do sự tiện lợi và hương vị hấp dẫn của thức ăn nhanh, nhiều bạn trẻ hiện nay đang duy trì một chế độ ăn uống thiếu cân bằng và chứa quá nhiều chất béo có hại. Các chuyên gia dinh dưỡng liên tục cảnh báo rằng việc tiêu thụ quá nhiều đồ ngọt và thực phẩm chiên rán sẽ làm gia tăng nguy cơ mắc bệnh béo phì ở lứa tuổi học đường.`,
   `Because of the convenience and appealing taste of fast food, many young people today are maintaining an unbalanced diet that contains too much harmful fat. Nutritionists repeatedly warn that consuming too many sweets and fried foods will increase the risk of obesity among school-age children.`],
  [`Khái niệm về lịch trình làm việc linh hoạt đã trở nên phổ biến trong những năm gần đây vì nó cho phép nhân viên quản lý tốt hơn các trách nhiệm công việc và cá nhân của họ. Các bậc cha mẹ làm việc tại nhà có thể dễ dàng sắp xếp thời gian để chăm sóc con cái mà không gặp trở ngại trong việc hoàn thành thời hạn công việc hằng ngày.`,
   `The concept of flexible working schedules has become popular in recent years because it allows employees to better manage their professional and personal responsibilities. Parents who work from home can easily arrange their time to look after their children without having trouble meeting their daily work deadlines.`],
  [`Trong khi việc nghe nhạc đã ghi âm trên các ứng dụng phát trực tuyến kỹ thuật số vô cùng thuận tiện, việc tham dự một buổi hòa nhạc trực tiếp lại mang đến một mức độ phấn khích và kết nối cảm xúc hoàn toàn khác biệt. Việc trở thành một phần của một đám đông lớn cùng hát theo nghệ sĩ tạo ra một cảm giác mạnh mẽ về cộng đồng mà không thể sao chép được khi ở nhà.`,
   `While listening to recorded music on digital streaming apps is extremely convenient, attending a live concert offers a completely different level of excitement and emotional connection. Being part of a large crowd singing along with the artist creates a powerful sense of community that cannot be replicated at home.`],
  [`Bởi vì sự phát triển nhanh chóng của công nghệ đã hình thành nên cách thức giao tiếp của các thế hệ khác nhau, cha mẹ và con cái thường cảm thấy khó hiểu được góc nhìn của nhau. Trong khi thanh thiếu niên thích sử dụng tin nhắn văn bản và mạng xã hội để bày tỏ cảm xúc của mình, các thành viên lớn tuổi trong gia đình thường coi trọng các cuộc trò chuyện trực tiếp, mặt đối mặt.`,
   `Because the rapid development of technology has shaped the way different generations communicate, parents and children often find it hard to understand each other's perspectives. While teenagers prefer to use text messages and social media to express their feelings, older family members tend to value direct, face-to-face conversations.`],
  [`Với tất cả sự cường điệu xung quanh Trí tuệ nhân tạo, robot, xe tự lái, v.v., thật dễ dàng để nghĩ rằng AI là thứ gì đó xa vời hoặc mang tính tương lai. Tuy nhiên, thực tế là AI đã được đan xen sâu sắc vào cuộc sống hàng ngày của chúng ta theo những cách mà chúng ta thậm chí có thể không nhận ra.`,
   `With all the hype surrounding artificial intelligence, robots, self-driving cars and so on, it is easy to think that AI is something distant or futuristic. The reality, however, is that AI is already deeply woven into our daily lives in ways we may not even notice.`],
  [`TOD (Transit-Oriented Development) là mô hình phát triển đô thị lấy giao thông công cộng làm trung tâm. Dù cách triển khai có thể khác nhau tùy địa phương, điểm chung của mô hình này là phát triển đa chức năng với mật độ cao, bao gồm nhà ở cao tầng, trung tâm thương mại, văn phòng, cùng các tiện ích giáo dục, y tế, thể thao...`,
   `TOD (Transit-Oriented Development) is an urban development model centred on public transport. Although its implementation may vary from place to place, what the model has in common is high-density, mixed-use development, including high-rise housing, shopping centres and offices, along with educational, medical and sports facilities.`],
  [`Động mạch chủ đưa máu đi nuôi cơ thể, là động mạch lớn nhất, đường kính lớn (khoảng 20-25 mm ở động mạch chủ bụng và khoảng 30 mm ở quai động mạch chủ ngực) để đảm bảo cung cấp máu giàu oxy đi nuôi toàn bộ cơ thể. Đường kính động mạch vành thường chỉ khoảng 3-4 mm ở các đoạn chính.`,
   `The aorta, which carries blood to nourish the body, is the largest artery; it has a large diameter (about 20–25 mm in the abdominal aorta and about 30 mm at the thoracic aortic arch) to ensure the supply of oxygen-rich blood to the whole body. The diameter of the coronary arteries is usually only about 3–4 mm in their main segments.`]

/* ===================== AI CHẤM BÀI DỊCH ===================== */
const KKEY='ontap_api_key';
const getKey=()=>{try{return localStorage.getItem(KKEY)||''}catch(e){return ''}};
const AI_SYS=`Bạn là giảng viên chấm bài học phần Biên phiên dịch 1 (sinh viên ngành Ngôn ngữ Anh). Chấm bài dịch của sinh viên so với đoạn gốc; bài dịch mẫu chỉ để tham khảo, cách dịch khác vẫn được điểm tối đa nếu đúng nghĩa và tự nhiên.
Trả lời bằng tiếng Việt, văn bản thuần (không dùng markdown), ngắn gọn, theo đúng bố cục:
Điểm: x/10
Sai/thiếu về nghĩa: liệt kê từng chỗ, trích cụm gốc và cụm sinh viên dịch (ghi "Không có" nếu không có)
Ngữ pháp, từ vựng, diễn đạt: các lỗi cụ thể kèm cách sửa
Bản sửa đề xuất: bài của sinh viên sau khi sửa, giữ cách diễn đạt của sinh viên ở những chỗ đã đúng`;
// mở dạng Artifact trên claude.ai thì dùng Claude của người xem, không cần API key
const samplerP=window.claude&&window.claude.use?window.claude.use('sample'):null;
const AI_ERR={not_granted:'Bạn chưa cho phép trang dùng Claude. Tải lại trang rồi bấm cho phép khi được hỏi.',sampling_disabled:'Tài khoản này không dùng được Claude trong trang.',rate_limited:'Đã hết lượt dùng Claude lúc này, thử lại sau.',session_expired:'Phiên đăng nhập đã hết hạn, hãy đăng nhập lại claude.ai.',refused:'AI từ chối chấm bài này.'};
async function askAI(system,content,onText){
  if(samplerP){
    const sample=await samplerP;
    if(!sample)throw new Error('Trang không gọi được Claude ở đây. Hãy mở bằng link Artifact trong claude.ai.');
    try{return (await sample(system+'\n\n'+content,{cache:false,onText:u=>onText(u.text)})).text.trim()}
    catch(e){throw new Error(AI_ERR[e.code]||'Chấm chưa thành công, thử lại sau.')}
  }
  let r;
  try{
    r=await fetch('https://api.anthropic.com/v1/messages',{method:'POST',
      headers:{'content-type':'application/json','x-api-key':getKey(),'anthropic-version':'2023-06-01',
        'anthropic-beta':'server-side-fallback-2026-07-01','anthropic-dangerous-direct-browser-access':'true'},
      body:JSON.stringify({model:'claude-opus-5-5',max_tokens:16000,fallbacks:'default',output_config:{effort:'medium'},system,
        messages:[{role:'user',content}]})});
  }catch(e){throw new Error('Không kết nối được tới api.anthropic.com. Kiểm tra mạng rồi thử lại.')}
  const j=await r.json().catch(()=>({}));
  if(r.status===401)throw new Error('API key không hợp lệ. Bấm ⚙️ để nhập lại.');
  if(!r.ok)throw new Error((j.error&&j.error.message)||('Lỗi HTTP '+r.status));
  if(j.stop_reason==='refusal')throw new Error('AI từ chối chấm đoạn này.');
  return (j.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('').trim();
}
// nút chấm + khung nhận xét dùng chung; run() trả về [system, nội dung] hoặc chuỗi báo chưa làm bài
function aiPanel(st,label,run){
  const ask=el('button','btn',label),ai=el('div','ai');
  const showAi=(txt,err)=>{ai.hidden=!txt;ai.className='ai'+(err?' err':'');ai.innerHTML=`<b class="h">${err?'Chưa chấm được':'Nhận xét của AI'}</b>`;ai.append(txt||'')};
  showAi(st.ai);
  ask.onclick=async()=>{
    const req=run();
    if(typeof req==='string'){showAi(req,1);return}
    if(!samplerP&&!getKey()){openCfg();return}
    ask.disabled=true;ask.textContent='Đang chấm…';
    try{st.ai=await askAI(...req,showAi);save();showAi(st.ai)}
    catch(e){showAi(e.message,1)}
    ask.disabled=false;ask.textContent=label;
  };
  return [ask,ai];
}
const words=t=>(t=t.trim())?t.split(/\s+/).length:0;
// nút làm lại từng câu; đã có bài thì phải bấm hai lần mới xoá
function redoBtn(has,reset){
  const b=el('button','btn ghost','↻ Làm lại');let armed=false;
  b.onclick=()=>{
    if(has()&&!armed){armed=true;b.textContent='Bấm lần nữa để xoá bài';setTimeout(()=>{armed=false;b.textContent='↻ Làm lại'},3000);return}
    reset();
  };
  return b;
}

/* ===================== MÀN: DỊCH ===================== */
function trItem(part,i){
  const [src,model]=part.items[i],id=part.id+(i+1);
  const st=S.tr[id]||(S.tr[id]={t:''});
  const d=el('div','rw');d.id=id;
  d.appendChild(el('div','src',`<b>${i+1}.</b> ${esc(src)}`));
  const ta=el('textarea');ta.placeholder=`Bài dịch sang ${part.to} của bạn…`;ta.value=st.t||'';
  const wc=el('div','wc');
  const count=()=>{wc.textContent=words(ta.value)+' từ'};
  ta.oninput=()=>{st.t=ta.value;save();count()};count();
  const foot=el('div','foot');
  const [ask,ai]=aiPanel(st,'AI chấm bài',()=>ta.value.trim()
    ?[AI_SYS,`Yêu cầu: dịch sang ${part.to}.\n\nĐoạn gốc:\n${src}\n\nBài dịch của sinh viên:\n${ta.value.trim()}\n\nBài dịch mẫu:\n${model}`]
    :'Bạn chưa nhập bài dịch.');
  const key=el('button','btn ghost');
  foot.append(ask,key,redoBtn(()=>ta.value.trim(),()=>{delete S.tr[id];save();d.replaceWith(trItem(part,i))}));
  const mo=el('div','model','<b>Bài dịch mẫu (tham khảo)</b><span></span>');mo.lastChild.textContent=model;
  const showKey=()=>{mo.hidden=!st.show;key.textContent=st.show?'Ẩn bài dịch mẫu':'Xem bài dịch mẫu'};
  key.onclick=()=>{st.show=!st.show;save();showKey()};showKey();
  d.append(ta,wc,foot,mo,ai);
  return d;
}
function buildDich(){
  const r=document.getElementById('dich');
  r.innerHTML=`<h1>Biên phiên dịch 1</h1><p class="lead">30 đoạn luyện tập (đề thi: 5 đoạn Anh → Việt và 5 đoạn Việt → Anh, mỗi đoạn 1 điểm). Bài làm tự lưu; bấm <b>AI chấm bài</b> để được nhận xét, hoặc xem bài dịch mẫu.</p>
  <div class="chips">${DICH.map(p=>`<a href="#${p.id}">${p.title.split('.')[0]}</a>`).join('')}</div>`;
  DICH.forEach(p=>{
    const c=el('div','card');c.id=p.id;
    c.innerHTML=`<h2 style="margin-top:0;padding-top:0">${esc(p.title)}</h2><p class="instr">${esc(p.instr)}</p>`;
    p.items.forEach((_,i)=>c.appendChild(trItem(p,i)));
    r.appendChild(c);
  });
}

const WR_HEAD='Bạn là giảng viên chấm bài học phần Kỹ năng Viết tiếng Anh 3 (sinh viên ngành Ngôn ngữ Anh). Trả lời bằng tiếng Việt, văn bản thuần (không dùng markdown), ngắn gọn, theo đúng bố cục:\n';
const EM_SYS=WR_HEAD+`Điểm: x/2
Nội dung: đã đủ các ý đề yêu cầu chưa, độ dài có khoảng 50 từ không
Hình thức email: lời chào, lời kết, giọng văn
Lỗi ngữ pháp, từ vựng, chính tả: từng lỗi kèm cách sửa
Bản sửa đề xuất: email của sinh viên sau khi sửa, giữ ý của sinh viên`;
const ES_SYS=WR_HEAD+`Điểm: x/5
Bố cục: mở bài, thân bài, kết bài có đúng dạng bài (discussion / cause and effect) không; độ dài 200–250 từ
Ý và lập luận: mức độ trả lời đề, độ rõ và sự phát triển của từng ý
Liên kết: từ nối so sánh – đối lập, nguyên nhân – kết quả
Lỗi ngữ pháp, từ vựng, chính tả: các lỗi chính kèm cách sửa
Gợi ý cải thiện: 2–3 việc cụ thể nên sửa trước`;

/* ===================== MÀN: VIẾT ===================== */
const norm=s=>s.toLowerCase().replace(/[’‘]/g,"'").replace(/[^a-z0-9' ]+/g,' ').replace(/\s+/g,' ').trim();
function rwItem(i){
  const [q,hint,ans]=REWRITE[i],id='rw'+(i+1);
  const st=S.wr[id]||(S.wr[id]={t:''});
  const d=el('div','rw');d.id=id;
  d.appendChild(el('div','qt',`<b>${i+1}.</b> ${esc(q)} <span class="hint">(${esc(hint)})</span>`));
  const inp=el('input');inp.type='text';inp.placeholder='Viết lại câu…';inp.value=st.t||'';
  const out=el('div'),foot=el('div','foot'),chk=el('button','btn ghost','Kiểm tra');
  const mo=el('div','model','<b>Đáp án gợi ý</b><span></span>');mo.lastChild.textContent=ans.join('\n');
  const verdict=()=>{
    out.innerHTML='';mo.hidden=!st.done;
    if(!st.done)return;
    const ok=ans.some(a=>norm(a)===norm(st.t));
    out.appendChild(el('div','verdict '+(ok?'ok':'no'),ok?'✓ Khớp đáp án':'Khác đáp án gợi ý — so với đáp án bên dưới'));
  };
  inp.oninput=()=>{st.t=inp.value;st.done=false;save();verdict()};
  chk.onclick=()=>{if(!inp.value.trim())return;st.done=true;save();verdict()};
  inp.onkeydown=e=>{if(e.key==='Enter')chk.click()};
  foot.append(chk,redoBtn(()=>inp.value.trim(),()=>{delete S.wr[id];save();d.replaceWith(rwItem(i))}));verdict();
  d.append(inp,out,foot,mo);
  return d;
}
function essayItem(id,srcHtml,task,sys,target,minH){
  const st=S.wr[id]||(S.wr[id]={t:''});
  const d=el('div','rw');d.id=id;
  d.appendChild(el('div','src',srcHtml));
  const ta=el('textarea');ta.style.minHeight=minH+'px';ta.placeholder='Bài viết của bạn…';ta.value=st.t||'';
  const wc=el('div','wc');
  const count=()=>{wc.textContent=`${words(ta.value)} từ (yêu cầu ${target})`};
  ta.oninput=()=>{st.t=ta.value;save();count()};count();
  const foot=el('div','foot');
  const [ask,ai]=aiPanel(st,'AI chấm bài',()=>ta.value.trim()?[sys,`Đề bài:\n${task}\n\nBài làm của sinh viên (${words(ta.value)} từ):\n${ta.value.trim()}`]:'Bạn chưa viết bài.');
  foot.append(ask,redoBtn(()=>ta.value.trim(),()=>{delete S.wr[id];save();d.replaceWith(essayItem(id,srcHtml,task,sys,target,minH))}));
  d.append(ta,wc,foot,ai);
  return d;
}
function buildViet(){
  const r=document.getElementById('viet');
  r.innerHTML=`<h1>Kỹ năng Viết 3</h1><p class="lead">3 dạng bài như đề thi: viết lại câu (3 điểm), email khoảng 50 từ (2 điểm), bài luận 200–250 từ (5 điểm). Bài làm tự lưu.</p>
  <div class="chips"><a href="#w1">I. Rewrite</a><a href="#w2">II. Email</a><a href="#w3">III. Essay</a></div>`;
  const card=(id,title,instr)=>{const c=el('div','card');c.id=id;c.innerHTML=`<h2 style="margin-top:0;padding-top:0">${title}</h2><p class="instr">${instr}</p>`;r.appendChild(c);return c};
  const c1=card('w1','I. Rewrite the sentences','Rewrite the following sentences using the suitable given words or structures. (3 pts)');
  REWRITE.forEach((_,i)=>c1.appendChild(rwItem(i)));
  const c2=card('w2','II. Email','Write an email in about 50 words according to the requirement and include the necessary information. (2 pts)');
  EMAILS.forEach(([q,pts],i)=>c2.appendChild(essayItem('em'+(i+1),
    `<b>Sample ${i+1}.</b> ${esc(q)}<ul class="tight">${pts.map(p=>`<li>${esc(p)}</li>`).join('')}</ul>`,
    q+'\n'+pts.map(p=>'+ '+p).join('\n'),EM_SYS,'khoảng 50 từ',120)));
  const c3=card('w3','III. Essay','Write a three or four paragraph essay in about 200 – 250 words. (5 pts)');
  ESSAYS.forEach(([kind,q],i)=>c3.appendChild(essayItem('es'+(i+1),
    `<b>Topic ${i+1} – ${kind}.</b> ${esc(q)}`,`${kind}: ${q}\nYêu cầu: bài luận 3–4 đoạn, 200–250 từ.`,ES_SYS,'200–250 từ',260)));
}

/* ===================== ĐIỀU HƯỚNG & CÀI ĐẶT ===================== */
function show(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.toggle('on',s.id===id));
  document.querySelectorAll('.tab[data-s]').forEach(t=>t.classList.toggle('on',t.dataset.s===id));
  document.querySelectorAll('audio').forEach(a=>{if(!a.closest('.screen.on'))a.pause()});
  S.tab=id;save();window.scrollTo(0,0);
}
document.querySelectorAll('.tab[data-s]').forEach(t=>t.onclick=()=>show(t.dataset.s));
// chỉ phát một file âm thanh tại một thời điểm
document.addEventListener('play',e=>{document.querySelectorAll('audio').forEach(a=>{if(a!==e.target)a.pause()})},true);
const cfg=document.getElementById('cfg'),cfgKey=document.getElementById('cfgKey');
function openCfg(){cfgKey.value=getKey();cfg.returnValue='';cfg.showModal()}
document.getElementById('cfgBtn').onclick=openCfg;
document.getElementById('cfgBtn').hidden=!!samplerP;
cfg.onclose=()=>{
  try{
    if(cfg.returnValue==='ok'&&cfgKey.value.trim())localStorage.setItem(KKEY,cfgKey.value.trim());
    if(cfg.returnValue==='del')localStorage.removeItem(KKEY);
  }catch(e){}
  cfgKey.value='';
};
// bản Artifact không kèm file ghi âm và ảnh nên chỉ có Viết và Dịch
const TABS=samplerP?['viet','dich']:['nghe','doc','viet','dich'];
document.querySelectorAll('.tab[data-s]').forEach(t=>t.hidden=!TABS.includes(t.dataset.s));
if(!samplerP){buildNghe();buildDoc()}
buildViet();buildDich();
show(TABS.includes(S.tab)?S.tab:TABS[0]);
